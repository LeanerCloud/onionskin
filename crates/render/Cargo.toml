[package]
name = "onionskin-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Pinned here rather than in the workspace root while the M1 spikes run in
# parallel; they move to `[workspace.dependencies]` once the seam is real.
[dependencies]
# Fork of hayro pinned by rev, exactly as crates/app pins the gpui fork.
# Published 0.7.1 draws an annotation's /AP /N only when it is a direct
# stream, so the state dictionaries selected by /AS that every checkbox and
# radio button uses render blank, with no warning. Upstream fixed that on
# main (LaurenzV/hayro 6af63be9) but has not released it; our rev adds three
# upstreamable commits on top: InterpreterWarning::UnresolvedAnnotationAppearance,
# so an annotation we fail to draw reaches warning_sink;
# InterpreterSettings::ocg_overrides, without which a layers pane cannot
# toggle anything because OcgState is built from the file's own /OCProperties
# /D inside Context::new_with; and InterpreterSettings::hairline_strokes, which
# View > Show/Hide > Line Weights needs, since the rasterizing device is
# private to hayro. Back to a released version once all four ship.
hayro = { git = "https://github.com/cristim/hayro", rev = "257a9e337d45fae5d16458e5157f51896d26d1a0" }
# SVG page export. A workspace member of the same fork at the same rev, so it
# shares one hayro-interpret with the rasterizer rather than adding a pin.
hayro-svg = { git = "https://github.com/cristim/hayro", rev = "257a9e337d45fae5d16458e5157f51896d26d1a0" }
tiny-skia = "0.12.0"
