[package]
name = "onionskin-content"
version.workspace = true
edition.workspace = true
license.workspace = true

# Declared here rather than in the workspace root so parallel milestone work
# does not collide on the root manifest.
[dependencies]
onionskin-cos.workspace = true

# Embedded font programs: widths, ascent/descent, and the cmap that turns a
# CID-keyed font with no /ToUnicode into readable text.
ttf-parser = { version = "0.25", default-features = false, features = [
    "std",
    "glyph-names",
] }

# Search folds presentation forms to base letters through NFKC. The table is
# large enough that hand-rolling the Arabic Presentation Forms-A and -B blocks
# would be worse than the dependency, and NFKC is the definition of the fold
# rather than an approximation of it.
unicode-normalization = "0.1"
