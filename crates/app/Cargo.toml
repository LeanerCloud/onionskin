[package]
name = "onionskin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "onionskin"
path = "src/main.rs"

[[bin]]
name = "shell_spike"
path = "src/bin/shell_spike.rs"
required-features = ["shell-spike"]

[[bin]]
name = "a11y_spike"
path = "src/bin/a11y_spike.rs"
required-features = ["a11y-spike"]

[dependencies]
# Not optional: `plugin-api` depends on it unconditionally, so every build
# already links it, and the preferences and recents files are expressed in
# its types.
onionskin-core.workspace = true
onionskin-print = { workspace = true, optional = true }
onionskin-plugin-api.workspace = true
onionskin-render = { workspace = true, optional = true }

# The keymap, preferences and recents files. Not optional: they are app
# state, and the headless build carries them so their tests run without GPUI.
serde.workspace = true
serde_json.workspace = true

# Fork of gpui 0.2.2 adding PinchEvent/on_pinch and stylus pressure, pinned
# by rev exactly as Schist pins it (PLAN.md key decision 5).
gpui = { git = "https://github.com/IAmJSD/gpui", rev = "84bdb01b29887ca09b6c437dad9a0ae838fe48e8", optional = true }
# `png` is the clipboard format for Take A Snapshot; the tile path needs
# only the buffer types.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
smallvec = { version = "1.13", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
accesskit = { version = "0.24", optional = true }
raw-window-handle = { version = "0.6", optional = true }
tempfile = { workspace = true, optional = true }

onionskin-codecs-common = { workspace = true, optional = true }
onionskin-commands-core = { workspace = true, optional = true }
onionskin-redact = { workspace = true, optional = true }
onionskin-tools-accessibility = { workspace = true, optional = true }
onionskin-tools-basic = { workspace = true, optional = true }
onionskin-tools-comment = { workspace = true, optional = true }
onionskin-tools-edit = { workspace = true, optional = true }
onionskin-tools-fill-sign = { workspace = true, optional = true }
onionskin-tools-form = { workspace = true, optional = true }
onionskin-tools-measure = { workspace = true, optional = true }
onionskin-tools-organize = { workspace = true, optional = true }
onionskin-tools-protect = { workspace = true, optional = true }

[dev-dependencies]
# Guarantee 2 is promised "driven by an edit a tool made through core", so
# the test that proves it has to reach a real tool. Not optional and not behind
# the feature: the guarantee tripwire rejects a file-level `cfg`, because one
# can compile a whole suite away while every test in it still reads as live.
onionskin-tools-comment.workspace = true
onionskin-cos.workspace = true
# Corpus discovery for the test targets. `crates/app/tests` had none, so its
# fixtures could neither be moved with `ONIONSKIN_CORPUS` nor made mandatory
# with `ONIONSKIN_CORPUS_REQUIRED`.
onionskin-corpus-testing.workspace = true
# `crates/app/tests/a11y_probe.rs` parses what the probe build prints.
serde_json.workspace = true
# `crates/app/tests/guarantees.rs` reads the CI and release workflows to prove
# the gates they declare are still gates. Two hand-written readers of that YAML
# were each bypassed by a construct they did not model - a folded scalar, a
# trailing comment - so it parses the real grammar instead.
yaml-rust2 = "0.10"
# ...and reads the cos suites the same way, for the same reason: three
# hand-written comment strippers in a row were each defeated by a comment shape
# they did not model. A comment is not a token, so a parser cannot be fooled by
# one.
syn = { version = "2", features = ["full", "visit", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.26", optional = true }
# The probe reads the NSAccessibility surface back off the view directly, so
# it can prove the tree without an accessibility-permission grant.
objc2 = { version = "0.5", optional = true }

# One feature per first-party plugin, all on by default. Turning them all
# off is guarantee test 5: the app still builds and boots, to a workspace
# that can do nothing.
[features]
default = [
    "codecs-common",
    "commands-core",
    "redact",
    "tools-accessibility",
    "tools-basic",
    "tools-comment",
    "tools-edit",
    "tools-fill-sign",
    "tools-form",
    "tools-measure",
    "tools-organize",
    "tools-protect",
]
codecs-common = ["dep:onionskin-codecs-common"]
commands-core = ["dep:onionskin-commands-core"]
redact = ["dep:onionskin-redact"]
tools-accessibility = ["dep:onionskin-tools-accessibility"]
tools-basic = ["dep:onionskin-tools-basic"]
tools-comment = ["dep:onionskin-tools-comment"]
tools-edit = ["dep:onionskin-tools-edit"]
tools-fill-sign = ["dep:onionskin-tools-fill-sign"]
tools-form = ["dep:onionskin-tools-form"]
tools-measure = ["dep:onionskin-tools-measure"]
tools-organize = ["dep:onionskin-tools-organize"]
tools-protect = ["dep:onionskin-tools-protect"]

# GPUI shell. Off by default: the kernel and its tests stay GPUI-free.
# AccessKit rides with the shell rather than behind a flag of its own:
# decision 12 makes the accessibility tree part of the first release, not an
# option a build can drop.
shell = [
    "dep:gpui",
    "dep:image",
    "dep:smallvec",
    "dep:unicode-segmentation",
    "dep:onionskin-render",
    "dep:accesskit",
    "dep:accesskit_macos",
    "dep:raw-window-handle",
    "dep:tempfile",
    "dep:onionskin-print",
]
shell-test-support = ["shell", "gpui/test-support"]
# Builds the app so that it reads its own accessibility tree back off the
# window, prints it and exits. Separate from `shell` because `objc2` is only
# needed to send those messages and nothing in the app itself sends them, and
# because a shipped build must open a window and stay open. Driven by
# `crates/app/tests/a11y_probe.rs`; `docs/spikes/m2-voiceover-acceptance.md`
# says what it can and cannot prove.
a11y-probe = ["shell", "dep:objc2"]
shell-spike = ["shell"]
a11y-spike = ["shell", "dep:objc2"]
