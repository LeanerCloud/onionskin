[package]
name = "onionskin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
onionskin-content.workspace = true
onionskin-cos.workspace = true
onionskin-render.workspace = true

# Corpus discovery for the test targets. `tests/session.rs` had a copy of its
# own that neither honoured `ONIONSKIN_CORPUS` nor could be made mandatory.
[dev-dependencies]
onionskin-corpus-testing.workspace = true
# `tests/edit.rs` builds base documents and reads back saved sections, which is
# cos's surface rather than core's re-exports.
onionskin-cos.workspace = true
# `tests/pages.rs` asserts that nothing in `core::pages` frees an object number,
# which T5 forbids. Parsed rather than grepped: the rule is stated in that
# module's own doc comment, so a substring scan finds the prose that promises it
# and reports the promise as a violation. A comment is not a token.
syn = { version = "2", features = ["full", "visit", "parsing"] }

# The decision-11 budgets, as benches that assert rather than print. Each one
# owns its own `main` (`harness = false`) because libtest's harness measures
# throughput and these measure whether a budget was met. `test = false` keeps
# them out of `cargo test`, where the dev profile would time an unoptimized
# build; `cargo clippy --all-targets` still lints them, and the CI bench job
# runs them with `cargo bench`.
[[bench]]
name = "open"
harness = false
test = false

[[bench]]
name = "paint"
harness = false
test = false

[[bench]]
name = "scroll"
harness = false
test = false

# P2's bound over resident bytes, measured rather than chosen: one entry for
# the 1000-page reorder and one session of a hundred annotations, both
# asserted against `MAX_HISTORY_BYTES`.
[[bench]]
name = "edit_entry"
harness = false
test = false

# P3's cost of one preview rebuild after an edit, which is O(file size) however
# small the edit: clean thousand-page, repaired, and the largest external file.
[[bench]]
name = "save"
harness = false
test = false

[[bench]]
name = "pages"
harness = false
test = false
