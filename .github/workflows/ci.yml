name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Guarantee test 6's malformed set. It is gitignored, and the repair test
      # returns early when it is absent, so without this step that test is
      # green and measuring nothing. Deterministic byte transforms of the
      # tracked seeds: no network, 15 files, no cache worth keeping. One runner
      # rather than the matrix, like the bench job - the repair path is byte
      # manipulation with no platform dimension, and the generator needs bash
      # and perl, which only the Linux runner is worth depending on for it.
      - name: Generate the malformed corpus set
        if: runner.os == 'Linux'
        run: ./corpus/make-malformed.sh
      - run: cargo test --workspace
      # Guarantee test 5: with every plugin compiled out, the app still
      # builds and boots to a workspace that can do nothing.
      - run: cargo test -p onionskin-app --no-default-features
      # A partial set, where all-on and all-off would both pass regardless:
      # it catches a plugin whose feature is enabled but whose manifest never
      # reached the registry.
      - run: cargo test -p onionskin-app --no-default-features --features tools-basic,commands-core

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e172ef532f714507ca8b9ce7978a442736438fc1 # v2.9.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      # `cargo deny check` reports all four sections green against a policy
      # that ignores every advisory, permits every license and trusts every
      # source: it enforces whatever deny.toml says, and says nothing about
      # whether deny.toml still says anything. This job would otherwise be
      # green while the policy it runs was gutted, which is worse than not
      # having it. Here rather than only in the test job so the gate and the
      # policy it depends on cannot pass separately.
      - name: Check the policy was not weakened
        run: cargo test -p onionskin-app --test guarantees -- --exact supply_chain_policy_is_checked_in_and_gated
      - name: Install Gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan secrets
        run: ./gitleaks detect --redact --source .

  # Guarantee test 9: PLAN.md decision 11's budgets, as benches that fail the
  # build when a budget is missed. One runner rather than the matrix: a budget
  # is one claim, and measuring it on three machines is three chances to flake
  # for it. Ubuntu, because every bench here is windowless and needs no GPU
  # toolchain.
  bench:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # A bench whose corpus is absent skips loudly and measures nothing. Here
      # that has to be a failure: a green job that proved no budget is worse
      # than no job at all.
      ONIONSKIN_CORPUS_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 159 MB of opt-in corpus for one file, so it is cached on the revisions
      # pinned in fetch.sh, its helper scripts, and its checksum manifest rather
      # than downloaded on every run.
      - name: Cache the hayro corpus
        uses: actions/cache@v4
        with:
          path: corpus/external
          key: corpus-hayro-${{ hashFiles('corpus/fetch.sh', 'corpus/verify-sha256.py', 'corpus/r2.py', 'corpus/checksums/hayro-corpus.sha256') }}
      # benches/paint.rs measures first paint on hayro-corpus/0041790.pdf, the
      # heaviest page the M1 spike found. fetch.sh skips a set already on disk,
      # so a cache hit makes this a no-op.
      - name: Fetch the first-paint corpus file
        run: ./corpus/fetch.sh hayro-corpus
      # Generated from nothing, and gitignored like the rest of the corpus.
      - name: Generate the thousand-page bench file
        run: ./corpus/make-bench.py
      - run: cargo bench -p onionskin-core

  shell:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfontconfig1-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install macOS Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: cargo build -p onionskin-app --features shell
      - run: cargo test -p onionskin-app --features shell
      # The window tests are gated on `shell-test-support`, so `--features
      # shell` alone compiles them nowhere and runs them nowhere: it reports
      # 108 lib tests where this reports 111. They drive gpui's test platform,
      # which allocates a TestWindow and no OS window, so they are safe on a
      # headless runner; macOS is the runner the shell is developed against,
      # so it is the one that owns them. Same command locally.
      - name: Windowed shell tests
        if: runner.os == 'macOS'
        run: cargo test -p onionskin-app --features shell,shell-test-support
      # Clippy must see the same targets, or a lint failure inside a
      # `shell-test-support` test reaches main unchallenged.
      - name: Clippy over the windowed targets
        if: runner.os == 'macOS'
        run: cargo clippy -p onionskin-app --features shell,shell-test-support --all-targets -- -D warnings
      # Reads the published accessibility tree back off a real NSView, which
      # is also where the check that the gpui fork still defines no
      # accessibility selectors of its own lives: it has to run on every fork
      # bump, so it is a test rather than a note. Unlike the windowed tests
      # above this opens real windows, so it needs the runner's window server.
      # This is a required gate: a fork bump that breaks the adapter must fail
      # before merge.
      - name: Accessibility probe
        if: runner.os == 'macOS'
        run: cargo test -p onionskin-app --features a11y-probe --test a11y_probe
