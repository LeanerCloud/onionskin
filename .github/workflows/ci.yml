name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Guarantee test 5: with every plugin compiled out, the app still
      # builds and boots to a workspace that can do nothing.
      - run: cargo test -p onionskin-app --no-default-features
      # A partial set, where all-on and all-off would both pass regardless:
      # it catches a plugin whose feature is enabled but whose manifest never
      # reached the registry.
      - run: cargo test -p onionskin-app --no-default-features --features tools-basic,commands-core

  # Guarantee test 9: PLAN.md decision 11's budgets, as benches that fail the
  # build when a budget is missed. One runner rather than the matrix: a budget
  # is one claim, and measuring it on three machines is three chances to flake
  # for it. Ubuntu, because every bench here is windowless and needs no GPU
  # toolchain.
  bench:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      # A bench whose corpus is absent skips loudly and measures nothing. Here
      # that has to be a failure: a green job that proved no budget is worse
      # than no job at all.
      ONIONSKIN_CORPUS_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 159 MB of opt-in corpus for one file, so it is cached on the revisions
      # pinned in fetch.sh rather than downloaded on every run.
      - name: Cache the hayro corpus
        uses: actions/cache@v4
        with:
          path: corpus/external
          key: corpus-hayro-${{ hashFiles('corpus/fetch.sh') }}
      # benches/paint.rs measures first paint on hayro-corpus/0041790.pdf, the
      # heaviest page the M1 spike found. fetch.sh skips a set already on disk,
      # so a cache hit makes this a no-op.
      - name: Fetch the first-paint corpus file
        run: ./corpus/fetch.sh hayro-corpus
      # Generated from nothing, and gitignored like the rest of the corpus.
      - name: Generate the thousand-page bench file
        run: ./corpus/make-bench.py
      - run: cargo bench -p onionskin-core

  shell:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfontconfig1-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install macOS Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: cargo build -p onionskin-app --features shell
      - run: cargo test -p onionskin-app --features shell
      # The window tests are gated on `shell-test-support`, so `--features
      # shell` alone compiles them nowhere and runs them nowhere: it reports
      # 108 lib tests where this reports 111. They drive gpui's test platform,
      # which allocates a TestWindow and no OS window, so they are safe on a
      # headless runner; macOS is the runner the shell is developed against,
      # so it is the one that owns them. Same command locally.
      - name: Windowed shell tests
        if: runner.os == 'macOS'
        run: cargo test -p onionskin-app --features shell,shell-test-support
      # Clippy must see the same targets, or a lint failure inside a
      # `shell-test-support` test reaches main unchallenged.
      - name: Clippy over the windowed targets
        if: runner.os == 'macOS'
        run: cargo clippy -p onionskin-app --features shell,shell-test-support --all-targets -- -D warnings
