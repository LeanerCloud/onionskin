name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Guarantee test 5: with every plugin compiled out, the app still
      # builds and boots to a workspace that can do nothing.
      - run: cargo test -p onionskin-app --no-default-features
      # A partial set, where all-on and all-off would both pass regardless:
      # it catches a plugin whose feature is enabled but whose manifest never
      # reached the registry.
      - run: cargo test -p onionskin-app --no-default-features --features tools-basic,commands-core

  shell:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update Linux package index
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfontconfig1-dev libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install macOS Metal toolchain
        if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: cargo build -p onionskin-app --features shell
      - run: cargo test -p onionskin-app --features shell
      # The window tests are gated on `shell-test-support`, so `--features
      # shell` alone compiles them nowhere and runs them nowhere: it reports
      # 108 lib tests where this reports 111. They drive gpui's test platform,
      # which allocates a TestWindow and no OS window, so they are safe on a
      # headless runner; macOS is the runner the shell is developed against,
      # so it is the one that owns them. Same command locally.
      - name: Windowed shell tests
        if: runner.os == 'macOS'
        run: cargo test -p onionskin-app --features shell,shell-test-support
      # Clippy must see the same targets, or a lint failure inside a
      # `shell-test-support` test reaches main unchallenged.
      - name: Clippy over the windowed targets
        if: runner.os == 'macOS'
        run: cargo clippy -p onionskin-app --features shell,shell-test-support --all-targets -- -D warnings
